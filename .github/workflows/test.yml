name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # 1つの組み合わせが落ちても、他の組み合わせの結果を最後まで見たい
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        # Windows / macOS は OS 依存の挙動（ProcessLock / アトミック書き込み /
        # パス検証 / ファイル名の大文字小文字）の確認が目的なので、
        # 代表として最新のサポートバージョンのみ実行する。
        # macOS の APFS は既定で大文字小文字を区別しないため、
        # 参照名の解決（issue #51）のような問題は macOS でも顕在化する。
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'

    # 全ステップを bash に統一する（Windows の既定シェルは pwsh のため、
    # rm -rf や dist/*.whl のグロブがそのままでは動かない）
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest pytest-cov

      - name: Clean build artifacts
        run: |
          rm -rf dist/ build/ *.egg-info/

      - name: Build package
        run: |
          python -m build

      - name: Install package
        run: |
          pip install dist/*.whl

      - name: Test import
        run: |
          python -c "from SessionSmith import save_session, load_session, SessionManager, ssm; print('Import successful')"

      - name: Run tests
        run: |
          pip install -e ".[dev]"
          # --cov-fail-under: 大幅なカバレッジ低下の検知が目的（実測は約43.6%）。
          # 実測値を下回るしきい値を段階的に引き上げていく。
          pytest tests/ -v --tb=short --timeout=300 -x --cov=SessionSmith --cov-report=term-missing --cov-report=xml --cov-fail-under=40

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          # dev extras (mypy/ruff に加え、crypto.py が実際に import する cryptography も含む)
          # をインストールする。ruff/mypy だけ入れると、gated scope に含まれる crypto.py の
          # `cryptography` import がスタブ欠如エラーになり CI が誤って壊れるため。
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check SessionSmith/ --ignore E501

      - name: Run mypy
        run: |
          # SessionSmith/ 配下の全モジュールを対象にした必須ゲート（issue #27）。
          # ignore_errors による除外は解消済みで、pyproject.toml の overrides に残るのは
          # 型スタブを提供していないサードパーティ依存の ignore_missing_imports のみ。
          mypy SessionSmith/

