[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SessionSmith"
dynamic = ["version"]
description = "Git-style session management for Python. Save, restore, and track your variables with ease."
readme = "readme.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "YutoTAKAGI", email = "yutotkg.1040@gmail.com"}
]
keywords = [
    "jupyter",
    "notebook",
    "session",
    "save",
    "load",
    "pickle",
    "serialization",
    "algorithm",
    "tracer",
    "visualization",
    "cli",
    "git",
    "version-control",
    "checkpoint",
    "machine-learning",
    "long-running",
    "recovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
visualization = ["matplotlib>=3.5.0"]
# セッションの暗号化・署名（認証付き暗号）
crypto = ["cryptography>=3.4"]
# クラウドストレージ・リモート
s3 = ["boto3>=1.26"]
gcs = ["google-cloud-storage>=2.0"]
cloud = ["boto3>=1.26", "google-cloud-storage>=2.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "cryptography>=3.4",
]
all = [
    "matplotlib>=3.5.0",
    "cryptography>=3.4",
    "boto3>=1.26",
    "google-cloud-storage>=2.0",
]

[project.scripts]
ssm = "SessionSmith.cli:main"

[project.urls]
Homepage = "https://github.com/yut0takagi/SessionSmith"
Documentation = "https://github.com/yut0takagi/SessionSmith/tree/main/docs"
Repository = "https://github.com/yut0takagi/SessionSmith.git"
Issues = "https://github.com/yut0takagi/SessionSmith/issues"
Changelog = "https://github.com/yut0takagi/SessionSmith/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "SessionSmith.__version__"}

[tool.setuptools.packages.find]
include = ["SessionSmith*"]

[tool.setuptools.package-data]
SessionSmith = ["py.typed"]

# ===== Development Tools =====

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["SessionSmith"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "E402",  # module level import not at top of file (Jupyter notebooks allow this)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from err (意図的に使用)
    "F401",  # 未使用インポート（オプショナル依存のため）
    "F821",  # 未定義名（IPython環境でのみ利用可能な関数のため）
]

[tool.mypy]
# python_version: インストールされる mypy (最新版がCIで使われる) が要求する最小対象バージョン。
# パッケージ自体は requires-python = ">=3.9" を維持している（実行時の互換性はpytestマトリクスで担保）。
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

# 型スタブを持たない（またはオプション依存で未インストールの場合がある）サードパーティライブラリ。
# グローバルな ignore_missing_imports の代わりに、実際にimportしているモジュールだけを列挙する。
[[tool.mypy.overrides]]
module = [
    "msgpack.*",       # formats.py: optional serializer, スタブ未提供
    "h5py.*",          # formats.py: optional serializer, スタブ未提供
    "numpy.*",         # formats.py/tracer.py: optional依存, 実行環境によっては未インストール
    "pandas.*",        # formats.py: optional依存, pandas-stubs別パッケージが必要
    "boto3.*",         # remote_backends.py: s3 extra, スタブ未提供(boto3-stubsは別パッケージ)
    "botocore.*",      # remote_backends.py: boto3の依存, スタブ未提供
    "google.*",        # remote_backends.py: gcs extra (google-cloud-storage), スタブ未提供
    "psutil.*",        # resource_manager.py: optional依存, スタブは types-psutil で別提供
    "matplotlib.*",    # visualizer*.py: visualization extra, py.typed未提供バージョンがある
]
ignore_missing_imports = true

# ---- 以下、issue #27 のスコープでは未対応の既存型エラーを抱えるモジュール ----
# CI必須ゲート(`mypy SessionSmith/`)からは ignore_errors で一時的に除外する。
# 段階的に縮小していく想定で、新規に対象を広げないこと。

[[tool.mypy.overrides]]
module = "SessionSmith.formats"
ignore_errors = true
# reason: msgpack/h5py 等スタブなしライブラリの戻り値がAnyになる no-any-return が複数あり、
# cast/型ガードの追加は別issueで対応する。

[[tool.mypy.overrides]]
module = "SessionSmith.remote_backends"
ignore_errors = true
# reason: boto3/google-cloud-storage クライアント呼び出しの戻り値がAnyになる no-any-return が
# 複数あり、上記と同様の理由で段階対応とする。

[[tool.mypy.overrides]]
module = "SessionSmith.core"
ignore_errors = true
# reason: load_session() のSSM成功パス(dict)とフォールバックパス(list)でloaded_varsの型が
# 食い違っている(no-redef/attr-defined)。挙動変更を伴いうるため、本チケットではCI設定のみを
# 扱い、修正は別issueに切り出す。

[[tool.mypy.overrides]]
module = "SessionSmith.manager"
ignore_errors = true
# reason: 非推奨の後方互換シム(SessionManager)。format引数のstr/Literal不一致など。
# ssm.py への移行が完了次第、削除または型修正を検討する。

[[tool.mypy.overrides]]
module = "SessionSmith.ssm"
ignore_errors = true
# reason: 最大のコアモジュール。format引数のLiteral化、Optionalなシグナルハンドラ型、
# TYPE_CHECKING専用のResourceManagerインポートなど13件の型エラーが残っており、
# 一度に修正するとリスクが高いため、次のissueで段階的に縮小する。

[[tool.mypy.overrides]]
module = "SessionSmith.cli"
ignore_errors = true
# reason: watchコマンド内でtry/exceptにまたがり同名変数fをGzipFile/TextIOWrapperで
# 使い回しており、mypyが型を一意に絞り込めない。CLI内部実装のリネームは本チケットの
# スコープ外とする。

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 30
markers = [
    "timeout: mark a test with a per-test timeout in seconds (requires pytest-timeout)",
]

[tool.coverage.run]
source = ["SessionSmith"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

